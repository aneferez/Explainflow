name: Validate ExplainFlow MCP

on:
  push:
    paths:
      - "mcp-server/**"
      - ".github/workflows/validate-mcp.yml"
  pull_request:
    paths:
      - "mcp-server/**"
      - ".github/workflows/validate-mcp.yml"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-server/package.json

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Typecheck
        run: npm run typecheck

      - name: Verify 30 format definitions
        run: |
          node --input-type=module - <<'NODE'
          import fs from 'node:fs';
          const text = fs.readFileSync('src/formats.ts', 'utf8');
          const commands = [
            'visualnotes','stickynotes','mindmap','infographic','flowchart','diagram','architecture','timeline','roadmap','cheatsheet',
            'conceptmap','tree','pipeline','workflow','funnel','layers','flashcards','comparison','quiz','eli10','beginner','expert','teacher',
            'mentor','stepbystep','keypoints','summary','examples','crashcourse','deepdive'
          ];
          const missing = commands.filter((cmd) => !text.includes(`"${cmd}"`));
          if (missing.length) {
            console.error('Missing ExplainFlow formats:', missing.join(', '));
            process.exit(1);
          }
          console.log(`Verified ${commands.length} ExplainFlow formats.`);
          NODE

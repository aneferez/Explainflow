name: Validate ExplainFlow Skill and Plugin

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate repository structure, skill, and plugin manifest
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          import re
          import sys

          required = [
              Path('SKILL.md'),
              Path('README.md'),
              Path('LICENSE'),
              Path('CONTRIBUTING.md'),
              Path('PRIVACY.md'),
              Path('TERMS.md'),
              Path('.codex-plugin/plugin.json'),
              Path('skills/explainflow/SKILL.md'),
              Path('skills/explainflow/references/COMMANDS.md'),
              Path('skills/explainflow/references/QUALITY_CHECKS.md'),
              Path('references/COMMANDS.md'),
              Path('references/QUALITY_CHECKS.md'),
              Path('examples/sample-prompts.md'),
              Path('evals/cases.md'),
              Path('evals/README.md'),
          ]

          missing = [str(p) for p in required if not p.exists()]
          if missing:
              print('Missing required files:', ', '.join(missing))
              sys.exit(1)

          def validate_skill(path):
              skill = path.read_text(encoding='utf-8')
              if not skill.startswith('---\n'):
                  raise SystemExit(f'{path} must start with YAML frontmatter.')
              frontmatter_end = skill.find('\n---\n', 4)
              if frontmatter_end == -1:
                  raise SystemExit(f'{path} frontmatter is not closed.')
              frontmatter = skill[4:frontmatter_end]
              if not re.search(r'^name:\s*explainflow\s*$', frontmatter, flags=re.M | re.I):
                  raise SystemExit(f'{path} must define name: explainflow')
              if not re.search(r'^description:\s*\S.+$', frontmatter, flags=re.M):
                  raise SystemExit(f'{path} must define a non-empty description.')

          validate_skill(Path('SKILL.md'))
          validate_skill(Path('skills/explainflow/SKILL.md'))

          commands_text = Path('references/COMMANDS.md').read_text(encoding='utf-8')
          commands = []
          for cmd in re.findall(r'`(/[-a-zA-Z0-9]+)`', commands_text):
              if cmd not in commands:
                  commands.append(cmd)

          if len(commands) < 30:
              raise SystemExit(f'Expected at least 30 documented commands; found {len(commands)}.')

          evals = Path('evals/cases.md').read_text(encoding='utf-8')
          uncovered = [cmd for cmd in commands if cmd not in evals]
          if uncovered:
              raise SystemExit('Commands missing from eval coverage: ' + ', '.join(uncovered))

          manifest = json.loads(Path('.codex-plugin/plugin.json').read_text(encoding='utf-8'))
          if manifest.get('name') != 'explainflow':
              raise SystemExit('Plugin manifest name must be explainflow.')
          if manifest.get('skills') != './skills/':
              raise SystemExit('Plugin manifest skills path must be ./skills/.')
          interface = manifest.get('interface') or {}
          for field in ['displayName', 'shortDescription', 'longDescription', 'developerName', 'category', 'websiteURL', 'privacyPolicyURL', 'termsOfServiceURL']:
              if not interface.get(field):
                  raise SystemExit(f'Missing plugin interface field: {field}')

          print(f'Validation passed: plugin manifest valid; {len(commands)} commands documented and covered by evals.')
          PY
